name: Store assets

# Captures Play Store screenshots and a promo-tour recording on an emulator with demo data,
# then pushes the raw captures to the `store-captures` branch.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to capture
        type: choice
        options: [both, screenshots, tour]
        default: both

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: WHAT=${{ inputs.what }} .github/scripts/store-capture.sh

      - name: Push captures to store-captures branch
        if: always()
        run: |
          set -e
          src="$RUNNER_TEMP/captures"
          [ -d "$src" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan store-captures-tmp
          git rm -rf -q .
          git clean -fdxq
          cp -r "$src"/. .
          git add -A
          git commit -q -m "Store captures from run ${{ github.run_number }}"
          git push -f origin HEAD:store-captures
