name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: .github/scripts/gradle.sh testDebugUnitTest

      - name: Lint
        run: .github/scripts/gradle.sh lintDebug

      - name: Assemble debug APK
        run: .github/scripts/gradle.sh assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sippo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    name: Signed release bundle
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIPPO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add SIPPO_KEYSTORE_BASE64, SIPPO_KEYSTORE_PASSWORD, SIPPO_KEY_ALIAS and SIPPO_KEY_PASSWORD repository secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sippo-release.jks"

      - name: Build release AAB
        env:
          SIPPO_KEYSTORE_PATH: ${{ runner.temp }}/sippo-release.jks
          SIPPO_KEYSTORE_PASSWORD: ${{ secrets.SIPPO_KEYSTORE_PASSWORD }}
          SIPPO_KEY_ALIAS: ${{ secrets.SIPPO_KEY_ALIAS }}
          SIPPO_KEY_PASSWORD: ${{ secrets.SIPPO_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: .github/scripts/gradle.sh bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: sippo-release-aab
          path: app/build/outputs/bundle/release/*.aab
